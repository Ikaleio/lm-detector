[package]
name = "lmfpd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Language-model fingerprint detection: offline scoring, challenges, and live detection"
repository = "https://github.com/Ikaleio/lm-detector"

[dependencies]
getrandom = "0.4.3"
regex = "1.13.1"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.0"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
